#!/usr/bin/env bash

# ── Terminal ──────────────────────────────────────────────────────────────────
set-option -sa terminal-features ',tmux:RGB'
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set-hook -g after-refresh-client 'set -g status 3; set -g status-format[1] ""; set -g status-format[2] ""'

# ── General ───────────────────────────────────────────────────────────────────
set -sg escape-time 0
set -g mouse on
set -g focus-events on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g status-position top
set-window-option -g mode-keys vi

# ── Keybinds ──────────────────────────────────────────────────────────────────
unbind %
bind - split-window -h -c "#{pane_current_path}"

unbind '"'
bind _ split-window -v -c "#{pane_current_path}"

bind c new-window -c "#{pane_current_path}"

unbind r
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r m resize-pane -Z

bind-key b set-option status
bind-key w choose-tree -Zw

# ── Copy mode ─────────────────────────────────────────────────────────────────
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection
unbind -T copy-mode-vi MouseDragEnd1Pane

# ── Plugins ───────────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

set -g @plugin '2kabhishek/tmux2k'

# ── tmux2k ────────────────────────────────────────────────────────────────────
set -g @tmux2k-theme 'catppuccin'
# Rose Pine Moon accent overrides for catppuccin named colors
set -g @tmux2k-black '#232136'
set -g @tmux2k-green        '#3e8fb0'   # pine  — session, git
set -g @tmux2k-light-green  '#9ccfd8'   # foam  — cpu
set -g @tmux2k-light-purple '#eb6f92'   # love  — battery
set -g @tmux2k-purple       '#c4a7e7'   # iris  — network
set -g @tmux2k-light-blue   '#f6c177'   # gold  — time
set -g @tmux2k-white '#908caa'   # inactive tab
set -g @tmux2k-blue         '#9ccfd8'   # foam  — tmux2k's "blue" slot
# Prefix indicator. Defaults to @tmux2k-blue, which was still catppuccin's
# #8aadf4. Rose is the one Rosé Pine accent not already used above, so an
# active prefix reads unambiguously against every segment.
set -g @tmux2k-prefix-highlight '#ea9a97'   # rose
set -g @tmux2k-icons-only true
set -g @tmux2k-military-time false
set -g @tmux2k-show-powerline true
set -g @tmux2k-powerline-style 'round'
set -g @tmux2k-start-icon ""
set -g @tmux2k-left-plugins  "session git cpu"
set -g @tmux2k-right-plugins "battery network time"
set -g @tmux2k-window-list-alignment 'absolute-centre'
set -g @tmux2k-window-list-compact true

# ── TPM bootstrap (keep last) ─────────────────────────────────────────────────
run '~/.tmux/plugins/tpm/tpm'
