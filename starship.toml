# =============================================================================
# Rosé Pine Moon — Starship Prompt
# Palette:
#   base       #232136  (background)
#   surface    #2a273f
#   overlay    #393552
#   muted      #6e6a86
#   subtle     #908caa
#   text       #e0def4
#   love       #eb6f92  (red)
#   gold       #f6c177  (yellow)
#   rose       #ea9a97  (pink)
#   pine       #3e8fb0  (cyan/blue)
#   foam       #9ccfd8  (teal)
#   iris       #c4a7e7  (purple)
#   highlight  #44415a
# =============================================================================

format = """
[╭─](fg:#6e6a86)\
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$git_state\
$rust\
$nodejs\
$c\
$python\
$cmd_duration\
$line_break\
[╰─](fg:#6e6a86)\
$character"""

palette = "rose_pine_moon"

[palettes.rose_pine_moon]
base = "#232136"
surface = "#2a273f"
overlay = "#393552"
muted = "#6e6a86"
subtle = "#908caa"
text = "#e0def4"
love = "#eb6f92"
gold = "#f6c177"
rose = "#ea9a97"
pine = "#3e8fb0"
foam = "#9ccfd8"
iris = "#c4a7e7"
highlight = "#44415a"

# =============================================================================
# OS icon
# =============================================================================

[os]
disabled = false
format = "[$symbol]($style) "
style = "fg:pine"

[os.symbols]
Linux = ""
Ubuntu = ""
Pop = ""

# =============================================================================
# Directory
# =============================================================================

[directory]
format = "[ $path]($style)[$read_only]($read_only_style) "
style = "fg:foam bold"
read_only = " 󰌾"
read_only_style = "fg:love"
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙"
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"src" = " "

# =============================================================================
# Git
# =============================================================================

[git_branch]
format = "[  $branch(:$remote_branch)]($style) "
style = "fg:iris"
truncation_length = 24
truncation_symbol = "…"

[git_status]
format = "[$all_status$ahead_behind]($style) "
style = "fg:rose"
conflicted = "󰩌 "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = "? "
stashed = " "
modified = "! "
staged = "+ "
renamed = "» "
deleted = "✘ "

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "fg:gold"

# =============================================================================
# Languages
# =============================================================================

[rust]
format = "[ $version]($style) "
style = "fg:love"
symbol = ""

[nodejs]
format = "[ $version]($style) "
style = "fg:foam"
symbol = "󰎙"

[c]
format = "[ $version]($style) "
style = "fg:gold"
symbol = " "

[python]
format = "[ $version]($style) "
style = "fg:iris"
symbol = " "

# =============================================================================
# Username / Hostname (shown only over SSH)
# =============================================================================

[username]
show_always = false
format = "[$user]($style)@"
style_user = "fg:text bold"
style_root = "fg:love bold"

[hostname]
ssh_only = true
format = "[$hostname]($style) "
style = "fg:pine"

# =============================================================================
# Command duration
# =============================================================================

[cmd_duration]
min_time = 2000
format = "[ $duration]($style) "
style = "fg:muted"

# =============================================================================
# Prompt character
# =============================================================================

[character]
success_symbol = "[❯](fg:pine bold)"
error_symbol = "[❯](fg:love bold)"
vimcmd_symbol = "[❮](fg:iris bold)"
